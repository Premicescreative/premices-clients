<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Soumission 1244 La Conciergerie</title><link rel="icon" href="img/icone.png"></head><body>

<!-- GABARIT Prémices : changer le <title>, le bloc JSON id="quote" et les fichiers img/ du client seulement. Voir SKILL.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a bound quote you flip through — top bar (agency × client, chapter), one full-screen chapter at a time, bottom bar (prev/next, chapter dots), floating price pill. Client colors come from the JSON (--b1 navy, --b2 blue, --b3 teal). */
:root{
  --b1:#163A60; --b2:#227BC3; --b3:#43A5AF;
  --bg:#f5f7f9; --paper:#ffffff; --ink:#0f1a26; --muted:#5d6977; --rule:#d6dde4; --soft:#edf1f5;
  --tint:color-mix(in srgb,var(--b3) 14%,var(--paper));
  --act:var(--b1); --act-ink:#ffffff; --hi:var(--b2); --ok:#2f7d3a;
  --cover-bg:#f3f6f9; --cover-ink:#0f1a26;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1119; --paper:#111a25; --ink:#e7eef5; --muted:#93a1b0; --rule:#243241; --soft:#17222f;
  --tint:color-mix(in srgb,var(--b3) 20%,var(--paper));
  --act:var(--b3); --act-ink:#06141a; --hi:#7fc6ff; --ok:#7cc98a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1119; --paper:#111a25; --ink:#e7eef5; --muted:#93a1b0; --rule:#243241; --soft:#17222f;
  --tint:color-mix(in srgb,var(--b3) 20%,var(--paper));
  --act:var(--b3); --act-ink:#06141a; --hi:#7fc6ff; --ok:#7cc98a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

/* Barres */
.bar-top,.bar-bot{display:flex;align-items:center;gap:14px;background:var(--paper);border-color:var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-top{padding-block:10px;border-bottom:1px solid var(--rule);justify-content:space-between}
.bar-bot{padding-block:10px;border-top:1px solid var(--rule);position:relative}
.duo{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:14px;white-space:nowrap}
.duo img{height:26px;width:26px}
.duo .x{color:var(--muted)}
.chap{display:flex;align-items:baseline;gap:10px;min-width:0}
.chap b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .num{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.chap b{display:none}}
.progress{position:absolute;left:0;top:-1px;height:2px;background:var(--hi);transition:width .5s var(--ease)}
.nav{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--rule);border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.nav:hover{border-color:var(--muted)}
.nav:disabled{opacity:.35;cursor:default}
.nav.primary{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.nav:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-width:0}
.dot{all:unset;cursor:pointer;width:9px;height:9px;border-radius:999px;background:var(--rule);transition:width .35s var(--ease),background .35s}
.dot[aria-current="step"]{width:26px;background:var(--act)}
.dot:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
@media (max-width:560px){.nav .t{display:none}}

/* Scène */
.stage{position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(24px,5vh,56px) 96px}
.slide[hidden]{display:none!important}
.inner{max-width:1040px;min-height:100%;margin:0 auto;display:grid;align-content:center;gap:28px}
.slide.in-next{animation:inNext .6s var(--ease) both}
.slide.in-prev{animation:inPrev .6s var(--ease) both}
@keyframes inNext{from{transform:translateX(6%);opacity:.2}to{transform:none;opacity:1}}
@keyframes inPrev{from{transform:translateX(-6%);opacity:.2}to{transform:none;opacity:1}}
.slide.go .rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
@keyframes rise{from{transform:translateY(18px);opacity:.15}to{transform:none;opacity:1}}
.kicker{display:flex;align-items:center;gap:12px}
.kicker .n{font-family:var(--mono);font-size:12px;color:var(--act);border:1px solid currentColor;border-radius:999px;padding:1px 9px}
.h{font-size:clamp(30px,5.2vw,56px);line-height:1.04;font-weight:800;letter-spacing:-.03em;max-width:18ch}
.sub{margin:0;color:var(--muted);font-size:clamp(15px,1.6vw,18px);max-width:60ch}

/* Couverture */
.cover{background:var(--cover-bg);color:var(--cover-ink)}
.cover .inner{justify-items:start;gap:34px}
.cover .lbl{color:#4d5d6d}
.lockup{display:grid;gap:22px;width:100%}
.agency{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:clamp(18px,2.4vw,24px);color:#0f1a26}
.agency .x{color:var(--b3)}
.logo-wrap{position:relative;width:min(760px,100%);aspect-ratio:1400/226}
.logo-wrap img{width:100%;height:100%;display:block}
.shine{position:absolute;inset:0;-webkit-mask:var(--logo-mask) center/100% 100% no-repeat;mask:var(--logo-mask) center/100% 100% no-repeat;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 48%,rgba(160,230,240,.8) 52%,transparent 65%) no-repeat;background-size:300% 100%;background-position:120% 0}
.slide.go .shine{animation:shine 1.3s ease-in-out 2.1s both}
@keyframes shine{from{background-position:120% 0}to{background-position:-40% 0}}
.cover-meta{display:flex;gap:28px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:#4d5d6d}
.cover-meta strong{display:block;font-weight:500;color:#0f1a26;font-size:15px}
.cover .h{color:#0f1a26;max-width:20ch}
.cover .start{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;background:var(--b1);color:#fff;padding:14px 22px;border-radius:999px;font-weight:600}
.cover .start:focus-visible{outline:2px solid var(--b2);outline-offset:3px}
.cover .start span{transition:transform .3s var(--ease)}
.cover .start:hover span{transform:translateX(4px)}
.replay{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;color:#4d5d6d;text-decoration:underline;text-underline-offset:3px}
.sparkle{position:absolute;width:10px;height:10px;opacity:0}
.sparkle::before,.sparkle::after{content:"";position:absolute;inset:4px 0;background:var(--b3);border-radius:2px}
.sparkle::after{inset:0 4px}
.slide.go .sparkle{animation:spark 1.1s ease-out both}
@keyframes spark{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1) rotate(45deg)}100%{opacity:0;transform:scale(.4) rotate(90deg)}}
/* Buée + raclette */
.fog{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(120% 90% at 30% 40%,rgba(225,234,242,.94),rgba(196,211,224,.96));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);clip-path:inset(0 0 0 100%)}
.squeegee{position:absolute;top:-4%;bottom:-4%;width:16px;left:-30px;z-index:4;pointer-events:none;opacity:0}
.squeegee::before{content:"";position:absolute;inset:0 5px;background:#10202f;border-radius:3px}
.squeegee::after{content:"";position:absolute;top:50%;left:8px;width:46px;height:10px;margin-top:-5px;background:var(--b3);border-radius:0 6px 6px 0}
.slide.go .fog{animation:wipe 1.5s cubic-bezier(.6,.05,.3,1) .35s both}
.slide.go .squeegee{animation:sweep 1.5s cubic-bezier(.6,.05,.3,1) .35s both}
@keyframes wipe{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
@keyframes sweep{0%{left:-2%;opacity:1}95%{opacity:1}100%{left:100%;opacity:0}}
.slide.go .agency{animation:rise .7s var(--ease) 1.5s both}
.slide.go .cover-anim{animation:rise .8s var(--ease) both;animation-delay:calc(1.6s + var(--i,0) * 90ms)}

/* Besoin */
.parties{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;border-top:1.5px solid var(--ink);padding-top:18px}
.parties div{display:grid;gap:1px;min-width:0}
.parties strong{font-weight:600;margin-top:6px}
@media (max-width:700px){.parties{grid-template-columns:1fr}}
.needs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.needs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:baseline;font-size:clamp(17px,2vw,22px);font-weight:500}
.needs li::before{content:"";width:22px;height:2px;background:var(--b3);transform:translateY(-6px)}

/* Cartes et choix */
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.preset{all:unset;cursor:pointer;position:relative;display:grid;gap:10px;align-content:start;padding:22px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.preset:hover{transform:translateY(-3px);border-color:var(--muted)}
.preset:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.preset[aria-pressed="true"]{border-color:var(--act);box-shadow:0 0 0 1px var(--act),0 18px 40px -24px color-mix(in srgb,var(--b1) 60%,transparent);background:var(--tint)}
.preset .pn{font-weight:700;font-size:20px;letter-spacing:-.01em}
.preset .pd{font-size:14px;color:var(--muted)}
.preset .pp{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;margin-top:8px}
.preset .pp small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}
.preset .tag{justify-self:start;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--act);color:var(--act-ink);padding:3px 8px;border-radius:999px}
.seg{display:inline-flex;justify-self:start;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--rule);border-radius:999px;background:var(--paper)}
.seg button{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);transition:background .3s,color .3s}
.seg button[aria-pressed="true"]{background:var(--act);color:var(--act-ink)}
.seg button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.ladder{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.rung{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(92px,.8fr) minmax(0,1.4fr) minmax(0,1.6fr) minmax(96px,.8fr);gap:14px;align-items:center;padding:12px 14px;border:1px solid transparent;border-radius:8px;transition:background .25s,border-color .25s}
.rung:not(.hd):hover{background:var(--soft)}
.rung:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.rung.hd{cursor:default;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-block:4px}
.rung[aria-pressed="true"]{border-color:var(--act);background:var(--tint)}
.rung .nn{font-weight:600}
.rung .sh{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rung .sh em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--b3);color:#06141a;padding:2px 7px;border-radius:999px}
.rung .per{display:flex;align-items:center;gap:10px;min-width:0}
.rung .per i{display:block;height:8px;border-radius:999px;background:var(--b3);flex:none;transition:width .6s var(--ease)}
.rung.opt .per i{background:var(--act)}
.rung .per b{font-weight:600;white-space:nowrap}
.rung .tt{text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
@media (max-width:700px){.rung{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}.rung.hd{display:none}.rung .sh{grid-column:1}.rung .per{grid-column:1/-1;grid-row:3}.rung .tt{grid-column:2;grid-row:1}}
.why{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:860px){.why{grid-template-columns:minmax(0,1fr)}}
.reasons{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.reasons{grid-template-columns:minmax(0,1fr)}}
.reasons li{display:grid;gap:6px;align-content:start;padding:18px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);border-top:3px solid var(--b3)}
.reasons strong{font-size:17px}
.reasons span{font-size:14px;color:var(--muted)}
.cmp{display:grid;gap:14px;padding:22px;border:1px solid var(--rule);border-radius:12px;background:var(--paper)}
.cmp-lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.cmp-lg span{display:inline-flex;align-items:center;gap:8px}
.cmp-lg i{display:inline-block;width:18px;height:8px;border-radius:999px}
.cmp-row{display:grid;gap:6px}
.cmp-row .cl{font-weight:600;font-size:14px}
.bars{display:grid;gap:5px}
.bars i{display:block;height:11px;border-radius:999px;width:var(--w)}
.ka{background:var(--rule)}
.kb{background:var(--act)}
.slide.go .bars i{animation:grow 1s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes grow{from{width:0}}
.also{display:grid;gap:6px;border-left:3px solid var(--b3);padding:6px 0 6px 18px;max-width:70ch}
.also strong{font-size:18px}
.also p{margin:0;color:var(--muted)}
.incl ul.vert{flex-direction:column;gap:10px}
.incl ul.plus li::before{content:"+"}
.bud .tot{font-size:clamp(32px,4.8vw,60px)}
.nw{white-space:nowrap}
.slide.go .bud .tot{animation:flash .9s var(--ease) .35s both}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pkg{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:8px;align-content:start;padding:clamp(20px,3vw,30px);border:1px solid var(--rule);border-radius:12px;background:var(--paper);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s,background .3s}
.pkg:hover{transform:translateY(-3px);border-color:var(--muted)}
.pkg:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.pkg[aria-pressed="true"]{border-color:var(--act);box-shadow:0 0 0 1px var(--act),0 22px 48px -26px color-mix(in srgb,var(--b1) 65%,transparent);background:var(--tint)}
.pkg .ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pkg .pn{font-weight:700;font-size:clamp(19px,2.2vw,24px);letter-spacing:-.01em}
.pkg .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--act);color:var(--act-ink);padding:3px 8px;border-radius:999px}
.pkg .pu{color:var(--muted);font-size:15px}
.pkg .pr{font-family:var(--mono);font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;margin-top:10px;font-variant-numeric:tabular-nums}
.pkg .pt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.incl{display:grid;gap:10px}
.incl ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px}
.incl li{display:flex;gap:8px;align-items:center;font-size:15px}
.incl li::before{content:"✓";color:var(--b3);font-weight:700}
.reco{display:grid;gap:8px;border-left:3px solid var(--b3);padding:6px 0 6px 18px;max-width:70ch}
.reco p{margin:0;font-size:16px}
.grid-chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--rule);border-radius:8px;cursor:pointer;background:var(--paper);min-width:0;transition:border-color .25s,background .25s,transform .25s var(--ease)}
.chk:hover{border-color:var(--muted)}
.chk:active{transform:scale(.985)}
.chk:has(input:checked){border-color:var(--act);background:var(--tint)}
.chk input{margin-top:3px;accent-color:var(--act);width:17px;height:17px;flex:none}
.chk .t{display:grid;gap:2px;min-width:0}
.chk .t>span:first-child{font-weight:500}
.chk .d{font-size:13px;color:var(--muted)}
.chk .p{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-left:8px}
.count{display:flex;align-items:baseline;gap:10px;font-family:var(--mono)}
.count b{font-size:clamp(40px,6vw,64px);font-weight:400;line-height:1;color:var(--act);font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 240px}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-bottom:1.5px solid var(--ink);padding:11px 12px;border-radius:0;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--hi);outline-offset:0}
.btn{font:600 15px var(--sans);background:var(--act);color:var(--act-ink);border:0;padding:13px 20px;border-radius:999px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:500;font-size:14px;padding:10px 16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.group{display:grid;gap:10px;align-content:start}
.group h3{font-size:16px;font-weight:600}
.radios{display:grid;gap:10px}
/* Ligne du temps de capsule */
.capsule{display:grid;gap:10px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px}
.screen{position:relative;aspect-ratio:16/6;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,var(--b1),color-mix(in srgb,var(--b1) 70%,var(--b2)))}
.screen .ttl{position:absolute;left:5%;bottom:14%;color:#fff;display:grid;gap:4px}
.screen .ttl small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:color-mix(in srgb,var(--b3) 60%,#fff)}
.screen .ttl b{font-size:clamp(16px,2.4vw,24px);font-weight:700}
.screen img{position:absolute;right:5%;top:12%;width:12%;filter:brightness(0) invert(1);opacity:.9}
.screen .play{position:absolute;left:0;bottom:0;height:3px;background:var(--b3);width:0}
.slide.go .screen .play{animation:play 3.2s linear .4s both}
@keyframes play{to{width:100%}}
.tl{display:flex;height:38px;border-radius:5px;overflow:hidden;font-family:var(--mono);font-size:11px}
.tl span{display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--soft);border-right:2px solid var(--paper);flex-basis:0;transition:flex-grow .6s var(--ease)}
.tl span:nth-child(odd){background:var(--tint)}
.tl-scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* Estimation */
.est{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:860px){.est{grid-template-columns:minmax(0,1fr)}}
.big{display:grid;gap:8px}

<script>
const Q = JSON.parse(document.getElementById("quote").textContent);
const $ = id => document.getElementById(id);
const money = n => n.toLocaleString("fr-CA",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/[  ]/g," ")+" $";
/* Fourchettes : prix bas et haut arrondis, quand le JSON a un bloc "range" */
const money0 = n => Math.round(n).toLocaleString("fr-CA",{maximumFractionDigits:0}).replace(/[  ]/g," ")+" $";
const RG = Q.range||null;
const range = (v,r=RG?.round||100) => RG ? money0(Math.floor(v*RG.low/r)*r)+" à "+money0(Math.ceil(v*RG.high/r)*r) : money(v);
/* Par unité : la fourchette du total divisée par n, pour que 1 unité = le total */
const rangePer = (sub,n) => { if(!RG) return money(sub/n); const r=RG.round||100, u=RG.roundUnit||50, lo=Math.floor(sub*RG.low/r)*r, hi=Math.ceil(sub*RG.high/r)*r; return money0(Math.floor(lo/n/u)*u)+" à "+money0(Math.ceil(hi/n/u)*u); };
const el = (tag, cls, text) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
const plural = (n,u) => n+" "+(n>1?u.many:u.one);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Couleurs et logo du client */
const C = Q.client||{}, root=document.documentElement.style;
if(C.colors){ root.setProperty("--b1",C.colors.primary); root.setProperty("--b2",C.colors.secondary); root.setProperty("--b3",C.colors.accent); }
if(C.logo) root.setProperty("--logo-mask",`url("${C.logo}")`);
$("topClient").textContent=Q.to.name;
if(C.icon) $("topIcon").src=C.icon; else $("topIcon").hidden=true;

/* État et calcul */
const S={units:new Set(),custom:[],choices:{},options:new Set()};
Q.units.items.forEach(u=>{ if(u.on) S.units.add(u.id); });
(Q.choiceGroups||[]).forEach(g=>{ S.choices[g.id]=g.default||g.choices[0].id; });
(Q.options?.items||[]).forEach(o=>{ if(o.on) S.options.add(o.id); });
S.pkg=Q.packages?(Q.packages.default||Q.packages.items[0].id):null;
const pkgOf=()=>Q.packages.items.find(p=>p.id===S.pkg)||Q.packages.items[0];
const curDur=()=>S.choices[Q.packages?.unitsBy];
const pkgN=(p=pkgOf())=>p.n[curDur()]??Object.values(p.n)[0];
const unitCount=()=>Q.packages?pkgN():S.units.size+S.custom.length;
/* Forfaits : fourchette du forfait + suppléments (voix, options) au prix approximatif */
function estimate(){
  const p=pkgOf(), n=pkgN(p), items=[[p.name,p.units[curDur()]||plural(n,Q.unit)]]; let extra=0;
  (Q.choiceGroups||[]).forEach(g=>{ if(g.id===Q.packages.unitsBy) return; const c=g.choices.find(x=>x.id===S.choices[g.id]); if(!c) return;
    if(c.extra){ extra+=c.extra*n; items.push([c.line||c.label,"+ ≈ "+money0(c.extra*n)]); } else items.push([c.line||c.label,"inclus"]); });
  (Q.options?.items||[]).forEach(o=>{ if(!S.options.has(o.id)) return; const a=o.kind==="perUnit"?o.price*n:o.price; extra+=a; items.push([o.label,"+ ≈ "+money0(a)]); });
  const r=Q.range?.round||100, tx=1+Q.taxes.reduce((s,t)=>s+t.rate,0), low=Math.floor((p.low+extra)/r)*r, high=Math.ceil((p.high+extra)/r)*r;
  return {p,n,items,low,high,lowT:Math.floor(low*tx/r)*r,highT:Math.ceil(high*tx/r)*r};
}
let lastE=null;
function priceOf(it,n){
  if(it.kind==="fixed") return {amt:it.price,q:""};
  if(it.kind==="perUnit") return {amt:it.price*n,q:n+" × "+money(it.price)};
  if(it.kind==="perBlock"){ const b=Math.max(1,Math.ceil(n/it.block)); return {amt:b*it.price,q:b+" "+(b>1?it.blockLabel[1]:it.blockLabel[0])+" × "+money(it.price)}; }
  if(it.kind==="shoot") return shootPlan(it,n);
  return {amt:0,q:""};
}
/* Tournage : le moins cher entre avant-midis et journées complètes pour filmer n unités */
function shootCap(it){ const g=(Q.choiceGroups||[]).find(g=>g.id===it.capacityGroup); const c=g&&g.choices.find(x=>x.id===S.choices[g.id]); return c?.shootCapacity||4; }
function shootPlan(it,n){
  const cap=shootCap(it); let best=null;
  for(let f=0;f<=Math.ceil(n/(2*cap));f++){ const rest=Math.max(0,n-f*2*cap); const h=Math.ceil(rest/cap); const amt=f*it.full.price+h*it.half.price;
    if(!best||amt<best.amt||(amt===best.amt&&f+h<best.f+best.h)) best={amt,f,h}; }
  const parts=[]; if(best.f) parts.push(best.f+" "+it.full.label[best.f>1?1:0]); if(best.h) parts.push(best.h+" "+it.half.label[best.h>1?1:0]);
  const room=best.f*2*cap+best.h*cap;
  return {amt:best.amt,q:parts.join(" + "),full:room===n,cap,plan:parts.join(" + ")};
}
function compute(n=unitCount(),optSet=S.options){
  const lines=[]; if(!n) return {n,lines,sub:0};
  Q.base.forEach(b=>lines.push({id:b.id,label:b.label,kind:b.kind,...priceOf(b,n)}));
  const ga={};

const shown=new WeakMap();
function countTo(node,value){
  const from=shown.get(node)??value; shown.set(node,value);
  if(reduced||from===value){ node.textContent=money(value); return; }
  const t0=performance.now(), d=700;
  const step=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); node.textContent=money(from+(value-from)*e); if(k<1&&shown.get(node)===value) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* 9. Conditions */

  head(inner,8,"Conditions","Les conditions, simplement");

/* 10. Envoyer */
let sendBox;
if(Q.thanks) chapter("merci",Q.thanks.nav||"Merci",inner=>{
  const T=Q.thanks;
  head(inner,0,T.nav||"Merci",T.title,T.text);
  const ul=el("ul","cond"); (T.cards||[]).forEach(([b,s],i)=>{ const li=rise(el("li"),3+i); li.append(el("strong",null,b), el("span",null,s)); ul.append(li); }); inner.append(ul);
  const ct=rise(el("div","contact"),7);
  ct.append(el("span","lbl","Pour nous joindre"), el("span","mail",Q.contactEmail));
  const row=el("div","copyrow"), m=el("p","msg"); m.setAttribute("role","status");
  const mk=(label,get,ok)=>{ const b=el("button","btn ghost",label); b.type="button"; b.onclick=async()=>{ try{ await navigator.clipboard.writeText(get()); m.textContent=ok; }catch(e){ m.textContent=get(); } }; return b; };
  row.append(mk("Copier l'adresse courriel",()=>Q.contactEmail,"Adresse copiée."));
  if(T.copySelection) row.append(mk(T.copySelection,summary,"Choix copiés. Collez-les dans votre courriel."));
  ct.append(row,m);
  if(Q.website){ const w=el("div","web"); w.append(el("span","lbl","Notre site web")); const a=el("a",null,Q.website.label+" ↗"); a.href=Q.website.url; a.target="_blank"; a.rel="noopener"; w.append(a); ct.append(w); }
  inner.append(ct);
  const sig=rise(el("div","sig"),8); sig.append(el("span",null,Q.from.name), el("span","x","×"));
  if(C.icon){ const im=el("img"); im.src=C.icon; im.alt=""; sig.append(im); } sig.append(el("span",null,Q.to.name)); inner.append(sig);
});
else chapter("envoyer",Q.send.title,inner=>{
  head(inner,9,"Dernière page",Q.send.title,Q.send.hint);
  sendBox=rise(el("div","send"),3); inner.append(sendBox);
});
function summary(){
  const names=[...Q.units.items.filter(u=>S.units.has(u.id)).map(u=>u.label),...S.custom];
  const out=["Soumission "+Q.number+" — "+Q.to.name, Q.showUnitsPage===false?plural(unitCount(),Q.unit):plural(unitCount(),Q.unit)+" : "+names.join(", ")];
  (Q.choiceGroups||[]).forEach(g=>out.push(g.title+" : "+g.choices.find(x=>x.id===S.choices[g.id]).label));
  out.push("Options : "+((Q.options?.items||[]).filter(o=>S.options.has(o.id)).map(o=>o.label).join(", ")||"aucune"));
  if(Q.packages&&lastE){ out.splice(1,1,lastE.p.name+" : "+lastE.items[0][1]); out.push("Estimation : "+money0(lastE.low)+" à "+money0(lastE.high)+" avant taxes"); return out.join("\n"); }
  out.push(RG?"Estimation : "+range(last.sub)+" avant taxes ("+range(last.total)+" avec taxes)":"Sous-total : "+money(last.sub)+" · Total avec taxes : "+money(last.total)); return out.join("\n");
}
function addCopy(box){
  if(box.querySelector(".copyrow")) return;
  const row=el("div","copyrow"); row.style.cssText="display:flex;gap:10px;flex-wrap:wrap"; const m=el("p","msg"); m.setAttribute("role","status");
  const mk=(label,get,ok)=>{ const b=el("button","btn ghost",label); b.type="button"; b.onclick=async()=>{ try{ await navigator.clipboard.writeText(get()); m.textContent=ok; }catch(e){ m.textContent=get(); } }; return b; };
  row.append(mk("Copier ma sélection",summary,"Sélection copiée."), mk("Copier l'adresse courriel",()=>Q.contactEmail,"Adresse copiée.")); box.append(row,m);
}
let recapEl;
function renderSend(db){
  const s=Q.send; sendBox.textContent="";
  recapEl=el("pre","recap"); sendBox.append(recapEl);
  if(!db){ sendBox.append(el("p",null,"Copiez votre sélection et envoyez-la à "+Q.contactEmail+". Nous vous revenons avec des disponibilités.")); addCopy(sendBox); updateRecap(); return; }
  const f=el("form"); f.noValidate=true; f.style.cssText="display:grid;gap:14px";
  f.innerHTML='<div class="fields"><label class="f">Nom<input type="text" id="sName" autocomplete="name"></label><label class="f">Courriel ou téléphone<input type="text" id="sContact" autocomplete="email"></label><label class="f full">Commentaires ou disponibilités (facultatif)<textarea id="sNote"></textarea></label></div><label class="chk"><input type="checkbox" id="sMeet" checked><span class="t"><span></span></span></label><button class="btn" type="submit" id="sBtn" disabled style="justify-self:start"></button><p class="msg" id="sMsg" role="status"></p>';
  f.querySelector("#sMeet + .t span").textContent=s.meeting; f.querySelector("#sBtn").textContent=s.button;
  const name=f.querySelector("#sName"), btn=f.querySelector("#sBtn"), msg=f.querySelector("#sMsg");
  const sync=()=>{ btn.disabled=!(name.value.trim().length>1&&unitCount()>0); }; name.addEventListener("input",sync); document.addEventListener("change",sync);
  f.addEventListener("submit",async e=>{
    e.preventDefault(); if(btn.disabled) return; btn.disabled=true; msg.textContent="Envoi…";
    try{
      await db.collection("demandes").add({quote:Q.number,client:Q.to.name,name:name.value.trim(),contact:f.querySelector("#sContact").value.trim(),note:f.querySelector("#sNote").value.trim(),meeting:f.querySelector("#sMeet").checked,
        units:[...Q.units.items.filter(u=>S.units.has(u.id)).map(u=>u.label),...S.custom],choices:{...S.choices},options:[...S.options],subtotal:last.sub,total:Math.round(last.total*100)/100,summary:summary(),sentAt:Date.now()});
      sendBox.textContent=""; const d=el("div","done"); d.append(el("strong",null,s.doneTitle), el("span",null,s.doneText)); const r=el("pre","recap",summary()); sendBox.append(d,r);
    }catch(err){ msg.textContent="L'envoi n'a pas fonctionné. Copiez votre sélection et écrivez à "+Q.contactEmail+"."; btn.disabled=false; addCopy(sendBox); }
  });
  sendBox.append(f); sync(); updateRecap();
}
function updateRecap(){ if(recapEl&&recapEl.isConnected) recapEl.textContent=summary(); }

/* Pastille de prix */
const pill=$("pill"), pillBtn=$("pillBtn"), pillPanel=$("pillPanel");
pillBtn.onclick=()=>{ const open=pillPanel.hidden; pillPanel.hidden=!open; pillBtn.setAttribute("aria-expanded",String(open)); };
function fillLines(box,r){ box.textContent=""; if(!r.n){ box.append(el("p","fine","Cochez au moins une tâche pour voir l'estimation.")); return; }
  r.lines.forEach(l=>{ const d=el("div","line"+(l.disc?" disc":"")); d.append(el("span","n",l.label), el("span","a",money(l.amt))); if(l.q) d.append(el("span","q",l.q)); box.append(d); }); }

/* Mise à jour */
let last={};
function update(){
  const r=compute(), T=totals(r.sub); last={...r,...T};
  $("unitBig")&&($("unitBig").textContent=r.n);
  presetBtns.forEach(([p,b])=>b.setAttribute("aria-pressed",String(presetMatches(p))));
  renderTimeline(); renderLadder(); renderPkgs();
  // pastille
  $("pillUnits").textContent=plural(r.n,Q.unit); countTo($("pillTotal"),T.total);
  pillBtn.classList.remove("bump"); if(!reduced){ void pillBtn.offsetWidth; pillBtn.classList.add("bump"); }
  pillPanel.textContent=""; pillPanel.append(el("span","lbl","Votre estimation")); const pl=el("div","lines"); fillLines(pl,r); pillPanel.append(pl);
  const pt=el("dl","totals"); pt.append(el("dt",null,"Sous-total"),el("dd",null,money(r.sub))); T.t.forEach(x=>pt.append(el("dt",null,x.label),el("dd",null,money(x.amt)))); pt.append(el("dt","g","Total"),el("dd","g",money(T.total))); pillPanel.append(pt);
  // estimation
  if(!estTot){ updateRecap(); return; }
  if(Q.packages){
    const E=estimate(); lastE=E;
    estTot.textContent=money0(E.low)+" à "+money0(E.high); estTot.classList.remove("flash"); if(!reduced){ void estTot.offsetWidth; estTot.classList.add("flash"); }
    estTx.textContent="Avec taxes (TPS et TVQ) : "+money0(E.lowT)+" à "+money0(E.highT);
    estLines.textContent=""; estLines.append(el("span","lbl","Votre choix"));
    E.items.forEach(([a,b])=>{ const d=el("div","line"); d.append(el("span","n",a), el("span","a",b)); estLines.append(d); });
    estTotals.textContent=""; estTotals.append(el("dt",null,"Avant taxes"),el("dd",null,money0(E.low)+" à "+money0(E.high)),el("dt","g","Avec taxes"),el("dd","g",money0(E.lowT)+" à "+money0(E.highT)));
    estStack.hidden=true; estLegend.hidden=true;
  } else if(RG){
    estTot.textContent=r.n?range(r.sub):"—"; estTot.classList.remove("flash"); if(!reduced){ void estTot.offsetWidth; estTot.classList.add("flash"); }
    estTx.textContent="Avec taxes (TPS et TVQ) : "+range(T.total);
    estLines.textContent=""; estLines.append(el("span","lbl","Ce qui est inclus"));
    r.lines.forEach(l=>{ const d=el("div","line"+(l.disc?" disc":"")); d.append(el("span","n",l.label)); d.append(el("span","a",l.disc?"inclus":l.kind==="shoot"?l.q:"✓")); estLines.append(d); });
    estTotals.textContent=""; estTotals.append(el("dt",null,"Avant taxes"),el("dd",null,range(r.sub)),el("dt","g","Avec taxes"),el("dd","g",range(T.total)));
  } else {
    countTo(estTot,T.total); estTx.textContent="Sous-total "+money(r.sub)+" · "+T.t.map(x=>x.label.split(" ")[0]+" "+money(x.amt)).join(" · ");
    fillLines(estLines,r); estTotals.textContent=""; estTotals.append(el("dt",null,"Sous-total"),el("dd",null,money(r.sub))); T.t.forEach(x=>estTotals.append(el("dt",null,x.label),el("dd",null,money(x.amt)))); estTotals.append(el("dt","g","Total"),el("dd","g",money(T.total)));
  }
  const pos=r.lines.filter(l=>l.amt>0);
  if(estStack.children.length!==pos.length){ estStack.textContent=""; pos.forEach((l,i)=>{ const s=el("span"); s.style.background=shades[i%shades.length]; s.style.flexGrow=0; estStack.append(s); }); estStack.offsetWidth; }
  [...estStack.children].forEach((s,i)=>{ s.style.flexGrow=pos[i].amt; s.title=RG?pos[i].label:pos[i].label+" · "+money(pos[i].amt); });
  estLegend.textContent=""; pos.forEach((l,i)=>{ const it=el("span"); const sw=el("i"); sw.style.background=shades[i%shades.length]; it.append(sw,document.createTextNode(l.label)); estLegend.append(it); });
  updateRecap();
}

/* Navigation */
let cur=-1;
const dots=$("dots");
chapters.forEach((c,i)=>{ const d=el("button","dot"); d.type="button"; d.setAttribute("aria-label",(i+1)+". "+c.name); d.title=c.name; d.onclick=()=>show(i); dots.append(d); });
function replay(s){ s.classList.remove("go"); void s.offsetWidth; s.classList.add("go"); }
function show(i,fromHash){
  i=Math.max(0,Math.min(chapters.length-1,i)); if(i===cur) return;
  const dir=i>cur?"in-next":"in-prev", prev=chapters[cur], next=chapters[i];
  if(prev){ prev.s.hidden=true; prev.s.classList.remove("go","in-next","in-prev"); }
  next.s.hidden=false; next.s.scrollTop=0; next.s.classList.remove("in-next","in-prev","go"); void next.s.offsetWidth;
  if(cur>=0&&!reduced) next.s.classList.add(dir); next.s.classList.add("go");
  cur=i;
  $("chapName").textContent=next.name; $("chapNum").textContent=String(i+1).padStart(2,"0")+" / "+String(chapters.length).padStart(2,"0");
  [...dots.children].forEach((d,k)=>{ if(k===i) d.setAttribute("aria-current","step"); else d.removeAttribute("aria-current"); });
  $("progress").style.width=((i)/(chapters.length-1)*100)+"%";
  $("prev").disabled=i===0; $("next").disabled=i===chapters.length-1;
  pill.hidden=!next.pill; pillPanel.hidden=true; pillBtn.setAttribute("aria-expanded","false");
  if(!fromHash){ try{ history.replaceState(null,"","#"+next.id); }catch(e){} }
}
$("prev").onclick=()=>show(cur-1); $("next").onclick=()=>show(cur+1);
document.addEventListener("keydown",e=>{
  const t=e.target; if(t.closest&&t.closest("input,textarea,select")) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); show(cur+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); show(cur-1); }
  if(e.key==="Escape"&&!pillPanel.hidden){ pillPanel.hidden=true; pillBtn.setAttribute("aria-expanded","false"); }
});
let tx=null,ty=null;
stage.addEventListener("touchstart",e=>{ if(e.touches.length===1){ tx=e.touches[0].clientX; ty=e.touches[0].clientY; } },{passive:true});
stage.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4&&!e.target.closest("input,textarea")) show(cur+(dx<0?1:-1)); },{passive:true});
function fromHash(){ const h=location.hash.slice(1); const i=chapters.findIndex(c=>c.id===h); return i; }
addEventListener("hashchange",()=>{ const i=fromHash(); if(i>=0) show(i,true); });

/* Démarrage */
renderUnits(); update(); if(sendBox) renderSend(null);
const h0=fromHash(); show(h0>=0?h0:0,true);

</script>
